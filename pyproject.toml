[project]
name = "talotrace-assessment"
version = "0.1.0"
description = "Async grounded chemistry whiteboard video service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "httpx>=0.28,<1",
  "openai>=2,<3",
  "psycopg[binary]>=3.2,<4",
  "redis>=6,<8",
  "rank-bm25>=0.2.2,<1",
  "numpy>=2,<3",
  "pypdf>=6,<7",
  "tiktoken>=0.11,<1",
  "python-dotenv>=1,<2",
  "pdf-inspector==1.18.0",
  "pillow>=11,<13",
  "pypdfium2==5.13.0",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/talotrace"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
