[unix_http_server]
file=/workspace/talotrace/logs/supervisor.sock
chmod=0700

[supervisord]
logfile=/workspace/talotrace/logs/supervisord.log
pidfile=/workspace/talotrace/logs/supervisord.pid
childlogdir=/workspace/talotrace/logs

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///workspace/talotrace/logs/supervisor.sock

[program:comfyui]
directory=/workspace/talotrace/ComfyUI
command=/opt/talotrace/venvs/comfy/bin/python main.py --listen 127.0.0.1 --port 8188 --disable-auto-launch --bf16-unet --bf16-text-enc
autostart=true
autorestart=unexpected
startretries=3
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/talotrace/logs/comfyui.log
stderr_logfile=/workspace/talotrace/logs/comfyui-error.log
environment=HF_HOME="/workspace/talotrace/.cache/huggingface"

[program:kokoro]
directory=/workspace/talotrace/infra/runpod
command=/opt/talotrace/venvs/kokoro/bin/python -m uvicorn kokoro_service:app --host 127.0.0.1 --port 8085
autostart=true
autorestart=unexpected
startretries=3
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/talotrace/logs/kokoro.log
stderr_logfile=/workspace/talotrace/logs/kokoro-error.log
environment=HF_HOME="/workspace/talotrace/.cache/huggingface",TALOTRACE_ROOT="/workspace/talotrace"
